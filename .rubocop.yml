AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Metrics/MethodLength:
  Max: 40
Style/Documentation:
  Enabled: false
Layout/LineLength:
  Max: 140
Metrics/ModuleLength:
  Max: 140
Metrics/BlockLength:
  Exclude:
    - spec/**/*
Metrics/AbcSize:
  Max: 25
  Exclude:
    - test/**/*
    - spec/**/*
